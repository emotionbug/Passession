[package]
name = "paseo-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
paseo-client = { path = "../packages/client" }
paseo-protocol = { path = "../packages/protocol" }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
toml_edit = "0.23"
walkdir = "2"
which = "7"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
