[workspace]
members = [
    "packages/daemon",
    "packages/protocol",
    "packages/client",
    "packages/plugin",
    "packages/relay",
    "packages/highlight",
    "packages/terminal",
    "xtask",
    "plugin-examples/workspace-inspector",
    "packages/relay-cloudflare",
    "packages/gui-core",
    "packages/gui-platform",
    "packages/gui",
]
exclude = ["packages/gui-platform/vendor", "packages/terminal/vendor"]
resolver = "3"

[workspace.package]
version = "0.13.25"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1

# xtask runs in the dev profile but hashes (SHA-256) and compresses (ZIP,
# gzip) the release artifacts several times per job; unoptimized, these crates
# dominate packaging and verification time. Outputs do not depend on opt-level,
# and the release profile is unaffected.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3

# Interactive builds keep optimizations without release's whole-program link.
[profile.dev-fast]
inherits = "dev"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
debug = 1

# Vendored Makepad patches: see component VENDORED.md files; makepad-platform's
# also records the adjacent shader compiler's Android GLES compatibility patch.
[patch.crates-io]
makepad-platform = { path = "packages/gui-platform/vendor/makepad-platform" }
makepad-draw = { path = "packages/gui-platform/vendor/makepad-draw" }
makepad-widgets = { path = "packages/gui-platform/vendor/makepad-widgets" }
makepad-shader-compiler = { path = "packages/gui-platform/vendor/makepad-shader-compiler" }
# libghostty-vt-sys build-script patch: packages/terminal/vendor/VENDORED.md.
libghostty-vt-sys = { path = "packages/terminal/vendor/libghostty-vt-sys" }
