[workspace]
members = [
    "packages/daemon",
    "packages/protocol",
    "packages/client",
    "packages/plugin",
    "packages/relay",
    "packages/highlight",
    "xtask",
    "plugin-examples/workspace-inspector",
    "packages/relay-cloudflare",
]
resolver = "3"

[workspace.package]
version = "0.13.2"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
