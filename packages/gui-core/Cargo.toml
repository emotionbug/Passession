[package]
name = "paseo-gui-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Non-UI runtime of the Paseo GUI: host connections, directory sync, persistence and the request/event boundary"

[dependencies]
paseo-client = { path = "../client" }
paseo-protocol = { path = "../protocol" }
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
paseo-browser = { path = "../browser" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
paseo-tailnet = { path = "../tailnet" }
dirs = "6"
tokio = { version = "1", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
paseo-tailnet = { path = "../tailnet", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
