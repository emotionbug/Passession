[package]
name = "paseo-gui-platform"
description = "Desktop and mobile OS integration for the native Passession client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "paseo_gui_platform"
path = "src/lib.rs"

[dependencies]
makepad-widgets = "=1.0.0"
paseo-gui-core = { path = "../gui-core" }
paseo-tailnet = { path = "../tailnet" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures-util = "0.3"
getrandom = "0.4"
percent-encoding = "2"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "process", "net"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# Desktop: Linux, macOS and Windows. Nothing here is compiled for Android or iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
base64 = "0.22"
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
dirs = "6"
# The portal backend stays; `wayland` only resolves `set_parent` Wayland handles,
# and no dialog sets a parent window.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
paseo-protocol = { path = "../protocol" }
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios", windows))'.dependencies]
keyring-core = "1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# DH-encrypted sessions. Blocking calls run on zbus's private Tokio runtime;
# call them off Tokio worker threads. The patched store disables async-io.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
# Keep the existing RustCrypto generation until the shared crypto stack moves.
secret-service = "~5.1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
objc2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(windows)'.dependencies]
paseo-client = { path = "../client" }
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-collections = "0.2"
# COM implementation macros expand absolute windows_core paths.
windows-core = "0.61"
windows-future = "0.2"
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Streams",
  "UI_Notifications",
  "ApplicationModel_DataTransfer",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Notifications",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

# Mobile: remote-only clients. No local daemon or updater code is linked.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rqrr = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
makepad-android-state = "0.1"

[dev-dependencies]
tempfile = "3"
