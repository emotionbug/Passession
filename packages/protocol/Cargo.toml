[package]
name = "paseo-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Paseo wire contracts, shared metadata, binary frames and endpoint cryptography"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
crypto_secretbox = { version = "0.1", features = ["salsa20"] }
curve25519-dalek = "4"
hmac = "0.12"
jsonschema = { version = "0.60.2", default-features = false }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
url = { version = "2", features = ["serde"] }
zeroize = "1"

[dev-dependencies]
hex = "0.4"
