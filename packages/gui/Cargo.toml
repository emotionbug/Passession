[package]
name = "paseo-gui"
description = "Passession native client (Makepad)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "paseo_gui"
path = "src/lib.rs"
# xtask builds the Android library with `cargo rustc --lib --crate-type cdylib`.

[[bin]]
name = "paseo-sessions"
path = "src/main.rs"

[features]
# In-process desktop lifecycle smoke driver (desktop-smoke-driver.md); never packaged.
desktop-smoke = []

[dependencies]
makepad-widgets = "=1.0.0"
paseo-gui-core = { path = "../gui-core" }
paseo-gui-platform = { path = "../gui-platform" }
paseo-client = { path = "../client" }
paseo-protocol = { path = "../protocol" }
paseo-highlight = { path = "../highlight" }
paseo-terminal = { path = "../terminal" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
resvg = { version = "0.45", default-features = false, features = ["text"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
unicode-segmentation = "1.11"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
paseo-browser = { path = "../browser" }

[build-dependencies]
embed-resource = "3"
