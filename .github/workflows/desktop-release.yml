name: Native Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag (vX.Y.Z or a platform release tag)
        required: true
        type: string
      mode:
        description: Build native artifacts or publish preserved artifacts from a prior run
        type: choice
        options: [build, publish-only]
        default: build
      recovery_run_id:
        description: Exact prior Native Release run ID; required for publish-only or publishing one desktop architecture
        type: string
        default: ""
      platform:
        description: Native platform, individual target, or Linux/Windows x64 plus Android
        type: choice
        options: [all, desktop, linux-windows-x64-android, macos, linux, windows, android, ios, macos-arm64, macos-x64, linux-arm64, linux-x64, windows-arm64, windows-x64, android-arm64]
        default: all
      checkout_ref:
        description: Optional source ref override (must have the same package version as tag)
        type: string
        default: ""
      notice_supplement_sha:
        description: Optional exact commit containing corrected Cargo license notices only; application source stays at the selected tag
        type: string
        default: ""
      publish:
        description: Publish artifacts to GitHub Releases
        type: choice
        options: ["true", "false"]
        default: "true"
      rollout_hours:
        description: Linear desktop rollout duration in hours; 0 admits everyone
        type: string
        default: "36"

permissions:
  contents: read
  packages: read

concurrency:
  group: native-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  SOURCE_TAG: ${{ inputs.tag }}
  CHECKOUT_REF: ${{ inputs.checkout_ref || inputs.tag }}
  SHOULD_PUBLISH: ${{ inputs.publish != 'false' }}
  RECOVERY_MODE: ${{ github.event.inputs.mode || 'build' }}
  RECOVERY_RUN_ID: ${{ github.event.inputs.recovery_run_id || '' }}
  ROLLOUT_HOURS: ${{ github.event.inputs.rollout_hours || '36' }}
  NOTICE_SUPPLEMENT_SHA: ${{ github.event.inputs.notice_supplement_sha || '' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      epoch: ${{ steps.source.outputs.epoch }}
      matrix: ${{ steps.plan.outputs.matrix }}
      windows_runners: ${{ steps.windows.outputs.runners }}
      expected: ${{ steps.plan.outputs.expected }}
      recovery: ${{ steps.plan.outputs.recovery }}
      release_tag: ${{ steps.plan.outputs.releaseTag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      create_release: ${{ steps.plan.outputs.createRelease }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.93.1
      # source and publish only build xtask (dev profile) on the same runner
      # image and environment, so they share one cache entry.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-xtask
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          INPUT_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        shell: bash
        run: cargo xtask release plan >> "$GITHUB_OUTPUT"
      - id: windows
        name: Select Windows runners for the COM smoke test
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        shell: bash
        run: echo "runners=$(jq -c '[.include[] | select(.platform == "windows") | .runner] | unique' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"
      - name: Validate recovery workflow and complete artifact inventory
        if: env.RECOVERY_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TARGETS: ${{ steps.plan.outputs.recovery }}
        run: cargo xtask release recovery

  native:
    needs: source
    if: github.event.inputs.mode != 'publish-only'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    name: native (${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.format == 'aab' && '-aab' || '' }})
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.source.outputs.epoch }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      PASEO_RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      PASEO_NATIVE_RELEASE: "1"
      PASEO_UPDATE_REPOSITORY: emotionbug/Passession
      PASEO_BUILD_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      TARGET_ID: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.format == 'aab' && '-aab' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Apply explicitly pinned packaging notice corrections
        if: env.NOTICE_SUPPLEMENT_SHA != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NOTICE_SUPPLEMENT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "notice_supplement_sha must be an exact commit SHA" >&2
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$NOTICE_SUPPLEMENT_SHA"
          notice_path=packaging/cargo-notice-supplements.json
          git show "$NOTICE_SUPPLEMENT_SHA:$notice_path" > "$RUNNER_TEMP/paseo-cargo-notices.json"
          cp "$RUNNER_TEMP/paseo-cargo-notices.json" "$notice_path"
          printf 'Application source: `%s`\n\nPackaging notices: `%s`\n' \
            "$SOURCE_SHA" "$NOTICE_SUPPLEMENT_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.platform == 'android' && 'aarch64-linux-android' || matrix.platform == 'ios' && 'aarch64-apple-ios' || '' }}
      # libghostty-vt-sys builds the Ghostty VT library with Zig 0.15.2. This
      # job builds older tags too, so it cannot rely on the local
      # .github/actions/setup-zig existing in the checked-out source; keep the
      # official archive digests (https://ziglang.org/download/index.json) in
      # sync with that action.
      - name: Install Zig 0.15.2
        shell: bash
        env:
          ZIG_VERSION: 0.15.2
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=x86_64-linux; ext=tar.xz; sha256=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239 ;;
            Linux-ARM64) target=aarch64-linux; ext=tar.xz; sha256=958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f ;;
            macOS-X64) target=x86_64-macos; ext=tar.xz; sha256=375b6909fc1495d16fc2c7db9538f707456bfc3373b14ee83fdd3e22b3d43f7f ;;
            macOS-ARM64) target=aarch64-macos; ext=tar.xz; sha256=3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b ;;
            Windows-X64) target=x86_64-windows; ext=zip; sha256=3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c ;;
            Windows-ARM64) target=aarch64-windows; ext=zip; sha256=b926465f8872bf983422257cd9ec248bb2b270996fbe8d57872cca13b56fc370 ;;
            *) echo "No pinned Zig $ZIG_VERSION build for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          name="zig-$target-$ZIG_VERSION"
          archive="$RUNNER_TEMP/$name.$ext"
          curl -fsSL --retry 3 -o "$archive" "https://ziglang.org/download/$ZIG_VERSION/$name.$ext"
          # Hash stdin: with a backslash path (Windows RUNNER_TEMP) sha256sum escapes the
          # file name and prefixes the digest line with '\'.
          if command -v sha256sum >/dev/null; then
            actual=$(sha256sum < "$archive" | cut -d' ' -f1)
          else
            actual=$(shasum -a 256 < "$archive" | cut -d' ' -f1)
          fi
          if [[ "$actual" != "$sha256" ]]; then
            echo "Zig archive SHA-256 mismatch: expected $sha256, got $actual" >&2
            exit 1
          fi
          if [[ "$ext" == zip ]]; then
            pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$archive' -DestinationPath '$RUNNER_TEMP'"
          else
            tar -xJf "$archive" -C "$RUNNER_TEMP"
          fi
          rm "$archive"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-global-cache" >> "$GITHUB_ENV"
          echo "GHOSTTY_CACHE_DIR=$RUNNER_TEMP/ghostty-cache" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/$name/zig" version
      # Zig's global cache holds Ghostty's fetched packages; GHOSTTY_CACHE_DIR
      # holds Zig's content-addressed local cache for this target
      # (zig-cache-<GHOSTTY_COMMIT>), so a warm run skips the Zig compile.
      # build.rs pins GHOSTTY_COMMIT, so its hash covers the commit.
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            ${{ runner.temp }}/ghostty-cache/zig-cache-*
          key: zig-0.15.2-${{ runner.os }}-${{ runner.arch }}-native-release-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.format == 'aab' && '-aab' || '' }}-${{ hashFiles('packages/terminal/vendor/libghostty-vt-sys/build.rs') }}
          restore-keys: |
            zig-0.15.2-${{ runner.os }}-${{ runner.arch }}-native-release-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.format == 'aab' && '-aab' || '' }}-
      # The Ghostty clone is target-independent: one entry per runner OS,
      # shared with CI and Native Desktop Packages. build.rs reuses it only when
      # HEAD is the pinned GHOSTTY_COMMIT and the tree is clean, else reclones.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ghostty-cache/ghostty-src
          key: ghostty-src-${{ runner.os }}-${{ hashFiles('packages/terminal/vendor/libghostty-vt-sys/build.rs') }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release-${{ matrix.platform }}-${{ matrix.arch }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # Packaging downloads: the pinned AppImage tools (Linux desktop), the
      # pinned Gradle distribution and Gradle's dependency cache (Android).
      # The key covers only the inputs that select that content; xtask
      # re-verifies cached AppImage tools against their pinned SHA-256 and
      # uses the unpacked Gradle, so its downloaded archive is not cached.
      - name: Select packaging cache key
        id: packaging-cache
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == linux ]]; then
            inputs=$(cat xtask/src/assets.rs)
          else
            gradle=$(grep -E '^const GRADLE_(VERSION|SHA256):' xtask/src/gui.rs || cat xtask/src/gui.rs)
            build=$(find packaging/android \( -name '*.kts' -o -name gradle.properties \) -print0 | LC_ALL=C sort -z | xargs -0 cat)
            inputs="$gradle$build"
          fi
          echo "key=$(printf '%s' "$inputs" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.packaging-cache.outputs.key != ''
        with:
          path: |
            ~/.cache/paseo-packaging/*
            !~/.cache/paseo-packaging/gradle-*-bin.zip
            ~/.gradle/caches
          key: native-packaging-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.packaging-cache.outputs.key }}
          restore-keys: |
            native-packaging-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-
      - name: Install Linux native build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libglx-dev libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxss1 libsm6 libice6 dpkg-dev xdg-utils patchelf
      - name: Provision pinned AppImage tools
        if: matrix.platform == 'linux'
        run: cargo xtask appimage-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis --version=3.11 --no-progress -y
      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-24.04 ships Android platform android-37.0 (compileSdk 37.0) but not NDK
      # 28.2.13676358 (r28c). Install it from Google's archive, pinned by SHA-256 (the
      # SHA-1 Google publishes is a7b54a5d…), instead of through sdkmanager, which the
      # image's cmdline-tools 22 report as deprecated on every call.
      - name: Install the pinned Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          pinned() { [[ -f "$ndk/source.properties" ]] && tr -d ' ' < "$ndk/source.properties" | grep -qx 'Pkg.Revision=28.2.13676358'; }
          if ! pinned; then
            archive="$RUNNER_TEMP/android-ndk-r28c-linux.zip"
            curl -fsSL --retry 3 -o "$archive" https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
            actual=$(sha256sum < "$archive" | cut -d' ' -f1)
            if [[ "$actual" != dfb20d396df28ca02a8c708314b814a4d961dc9074f9a161932746f815aa552f ]]; then
              echo "Android NDK archive SHA-256 mismatch: got $actual" >&2
              exit 1
            fi
            mkdir -p "$ANDROID_HOME/ndk"
            rm -rf "$ndk" "$ANDROID_HOME/ndk/android-ndk-r28c"
            unzip -q "$archive" -d "$ANDROID_HOME/ndk"
            mv "$ANDROID_HOME/ndk/android-ndk-r28c" "$ndk"
            rm "$archive"
            pinned
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Stage optional Android release signing key
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/paseo-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/paseo-release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build Rust GUI client and native Rust desktop runtime
        run: cargo xtask build-gui ${{ matrix.platform }} --profile release ${{ matrix.platform == 'android' && format('--arch {0} --format {1}', matrix.arch, matrix.format) || '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PASEO_BUILD_NUMBER: ${{ vars.PASEO_BUILD_NUMBER }}
      - name: Inspect native macOS build output
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          bundle=".dev/build/gui/desktop/${TARGET_ID}/release/Passession.app"
          /usr/bin/lipo -info "$bundle/Contents/MacOS/Passession"
          "$bundle/Contents/Resources/runtime/paseo" --version
      # Without mobile signing credentials, artifacts are explicitly labelled
      # debug-signed APK/AAB / unsigned iOS .app, never presented as store submissions.
      - name: Package native desktop installers
        if: matrix.desktop
        run: cargo xtask package-desktop ${{ matrix.platform }}
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Package complete standalone native daemon
        if: matrix.desktop
        run: cargo xtask package-daemon
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Generate native update manifests
        if: matrix.desktop
        run: cargo xtask release manifests
      - name: Record exact source, run and artifact hashes
        run: cargo xtask release record
      - uses: actions/upload-artifact@v7
        with:
          name: native-release-${{ env.TARGET_ID }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/native/Passession-*
            artifacts/native/Paseo-Daemon-*
            artifacts/native/daemon-*.json
            artifacts/native/flutter-*.json
            artifacts/native/packages-*.json
            artifacts/native/provenance-*.json

  # The COM smoke test compiles its own release test graph (gui-platform alone
  # resolves different features than the shipped gui + daemon build), so it
  # runs beside the Windows builds instead of after them. It produces no
  # artifacts, and publish still requires it to pass.
  windows-com-smoke:
    needs: source
    if: github.event.inputs.mode != 'publish-only' && needs.source.outputs.windows_runners != '[]'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.source.outputs.windows_runners) }}
    name: windows-com-smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-com-smoke
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Smoke Windows file-share COM marshalling
        run: cargo test --locked --release -p paseo-gui-platform --lib share_item_resolves_across_apartments

  publish:
    needs: [source, native, windows-com-smoke]
    if: ${{ !cancelled() && github.repository == 'emotionbug/Passession' && needs.source.result == 'success' && needs.source.outputs.publish == 'true' && (needs.native.result == 'success' || github.event.inputs.mode == 'publish-only') && (needs.windows-com-smoke.result == 'success' || needs.windows-com-smoke.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: desktop-rollout-${{ needs.source.outputs.release_tag }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      PASEO_RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      EXPECTED_TARGETS: ${{ needs.source.outputs.expected }}
      RECOVERY_TARGETS: ${{ needs.source.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-xtask
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Download current build artifacts
        if: github.event.inputs.mode != 'publish-only'
        uses: actions/download-artifact@v8
        with:
          pattern: native-release-*
          merge-multiple: true
          path: artifacts/native
      - name: Download exact recovery artifacts
        if: env.RECOVERY_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release recovery --download
      - name: Validate all source and artifact provenance before any release mutation
        run: cargo xtask release verify
      - name: Publish native release assets and finalize complete desktop rollout
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_RELEASE: ${{ needs.source.outputs.create_release }}
          IS_PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: cargo xtask release publish
