name: Native Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag (vX.Y.Z or a platform release tag)
        required: true
        type: string
      mode:
        description: Build native artifacts or publish preserved artifacts from a prior run
        type: choice
        options: [build, publish-only]
        default: build
      recovery_run_id:
        description: Exact prior Native Release run ID; required for publish-only or publishing one desktop architecture
        type: string
        default: ""
      platform:
        description: Native platform, individual desktop target, or Linux/Windows x64 plus Android
        type: choice
        options: [all, desktop, linux-windows-x64-android, macos, linux, windows, android, ios, macos-arm64, macos-x64, linux-arm64, linux-x64, windows-arm64, windows-x64]
        default: all
      checkout_ref:
        description: Optional source ref override (must have the same package version as tag)
        type: string
        default: ""
      notice_supplement_sha:
        description: Optional exact commit containing corrected Cargo license notices only; application source stays at the selected tag
        type: string
        default: ""
      publish:
        description: Publish artifacts to GitHub Releases
        type: choice
        options: ["true", "false"]
        default: "true"
      rollout_hours:
        description: Linear desktop rollout duration in hours; 0 admits everyone
        type: string
        default: "36"

permissions:
  contents: read
  packages: read

concurrency:
  group: native-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ inputs.tag }}
  CHECKOUT_REF: ${{ inputs.checkout_ref || inputs.tag }}
  SHOULD_PUBLISH: ${{ inputs.publish != 'false' }}
  RECOVERY_MODE: ${{ github.event.inputs.mode || 'build' }}
  RECOVERY_RUN_ID: ${{ github.event.inputs.recovery_run_id || '' }}
  ROLLOUT_HOURS: ${{ github.event.inputs.rollout_hours || '36' }}
  NOTICE_SUPPLEMENT_SHA: ${{ github.event.inputs.notice_supplement_sha || '' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      epoch: ${{ steps.source.outputs.epoch }}
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      recovery: ${{ steps.plan.outputs.recovery }}
      release_tag: ${{ steps.plan.outputs.releaseTag }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      create_release: ${{ steps.plan.outputs.createRelease }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          INPUT_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
        shell: bash
        run: cargo xtask release plan >> "$GITHUB_OUTPUT"
      - name: Validate recovery workflow and complete artifact inventory
        if: env.RECOVERY_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_TARGETS: ${{ steps.plan.outputs.recovery }}
        run: cargo xtask release recovery

  native:
    needs: source
    if: github.event.inputs.mode != 'publish-only'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    name: native (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      SOURCE_DATE_EPOCH: ${{ needs.source.outputs.epoch }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      PASEO_RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      PASEO_NATIVE_RELEASE: "1"
      PASEO_UPDATE_REPOSITORY: emotionbug/paseo
      PASEO_BUILD_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      TARGET_ID: ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Apply explicitly pinned packaging notice corrections
        if: env.NOTICE_SUPPLEMENT_SHA != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NOTICE_SUPPLEMENT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "notice_supplement_sha must be an exact commit SHA" >&2
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$NOTICE_SUPPLEMENT_SHA"
          notice_path=packaging/cargo-notice-supplements.json
          git show "$NOTICE_SUPPLEMENT_SHA:$notice_path" > "$RUNNER_TEMP/paseo-cargo-notices.json"
          cp "$RUNNER_TEMP/paseo-cargo-notices.json" "$notice_path"
          printf 'Application source: `%s`\n\nPackaging notices: `%s`\n' \
            "$SOURCE_SHA" "$NOTICE_SUPPLEMENT_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.platform == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || matrix.platform == 'ios' && 'aarch64-apple-ios' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-release-${{ matrix.platform }}-${{ matrix.arch }}
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/paseo-packaging
            ~/.gradle/caches
          key: native-packaging-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('xtask/src/**', 'packaging/android/**/*.kts') }}
      - name: Install Linux native build prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libglx-dev libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxss1 libsm6 libice6 dpkg-dev xdg-utils patchelf
      - name: Provision pinned AppImage tools
        if: matrix.platform == 'linux'
        run: cargo xtask appimage-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis --version=3.11 --no-progress -y
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools ndk;28.2.13676358
      - name: Select the pinned Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Stage optional Android release signing key
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/paseo-release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/paseo-release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build Rust GUI client and native Rust desktop runtime
        run: cargo xtask build-gui ${{ matrix.platform }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PASEO_BUILD_NUMBER: ${{ vars.PASEO_BUILD_NUMBER }}
      - name: Inspect native macOS build output
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          bundle="target/paseo-gui/desktop/${TARGET_ID}/release/Paseo Sessions.app"
          /usr/bin/lipo -info "$bundle/Contents/MacOS/Paseo Sessions"
          "$bundle/Contents/Resources/runtime/paseo" --version
      # Without mobile signing credentials, artifacts are explicitly labelled
      # debug-signed APK / unsigned iOS .app, never presented as store submissions.
      - name: Package native desktop installers
        if: matrix.desktop
        run: cargo xtask package-desktop ${{ matrix.platform }}
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Package complete standalone native daemon
        if: matrix.desktop
        run: cargo xtask package-daemon
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Generate native update manifests
        if: matrix.desktop
        run: cargo xtask release manifests
      - name: Record exact source, run and artifact hashes
        run: cargo xtask release record
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/native/Paseo-Sessions-*
            artifacts/native/Paseo-Daemon-*
            artifacts/native/daemon-*.json
            artifacts/native/flutter-*.json
            artifacts/native/packages-*.json
            artifacts/native/provenance-*.json

  publish:
    needs: [source, native]
    if: ${{ !cancelled() && github.repository == 'emotionbug/paseo' && needs.source.result == 'success' && needs.source.outputs.publish == 'true' && (needs.native.result == 'success' || github.event.inputs.mode == 'publish-only') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: desktop-rollout-${{ needs.source.outputs.release_tag }}
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
      PASEO_RELEASE_CHANNEL: ${{ needs.source.outputs.channel }}
      EXPECTED_TARGETS: ${{ needs.source.outputs.expected }}
      RECOVERY_TARGETS: ${{ needs.source.outputs.recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Download current build artifacts
        if: github.event.inputs.mode != 'publish-only'
        uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          merge-multiple: true
          path: artifacts/native
      - name: Download exact recovery artifacts
        if: env.RECOVERY_RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release recovery --download
      - name: Validate all source and artifact provenance before any release mutation
        run: cargo xtask release verify
      - name: Publish native release assets and finalize complete desktop rollout
        env:
          GH_TOKEN: ${{ github.token }}
          CREATE_RELEASE: ${{ needs.source.outputs.create_release }}
          IS_PRERELEASE: ${{ needs.source.outputs.prerelease }}
        run: cargo xtask release publish
