name: Release Notes Sync

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.1.14). Leave empty to use top changelog entry."
        required: false
        type: string
      create_if_missing:
        description: "Create a draft release if missing."
        required: false
        default: false
        type: boolean

concurrency:
  group: release-notes-sync-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  sync-release-notes:
    if: github.repository == 'emotionbug/paseo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2

      - name: Sync release body from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CREATE_IF_MISSING: ${{ github.event.inputs.create_if_missing }}
        shell: bash
        run: |
          set -euo pipefail

          args=(--publish --repo "$REPO")

          if [ -n "${INPUT_TAG:-}" ]; then
            args+=(--tag "$INPUT_TAG")
          fi

          if [ "${INPUT_CREATE_IF_MISSING:-false}" = "true" ]; then
            args+=(--create-if-missing)
          fi

          cargo xtask release notes "${args[@]}"
