name: Native Desktop Packages

on:
  workflow_dispatch:

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  PASEO_NATIVE_RELEASE: "1"
  PASEO_UPDATE_REPOSITORY: emotionbug/paseo
  PASEO_BUILD_SOURCE_SHA: ${{ github.sha }}
  SOURCE_SHA: ${{ github.sha }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-packages-linux-x64
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libglx-dev libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxss1 libsm6 libice6 dpkg-dev xdg-utils patchelf
      - name: Resolve native package channel
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "paseo-daemon") | .version')"
          plan="$(SOURCE_TAG="v${version}" cargo xtask release plan)"
          while IFS='=' read -r key value; do
            if [ "$key" = "channel" ]; then
              printf 'PASEO_RELEASE_CHANNEL=%s\n' "$value" >> "$GITHUB_ENV"
            fi
          done <<< "$plan"
      - name: Provision pinned AppImage tools
        run: cargo xtask appimage-tools
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build native Linux app and bundled daemon
        run: cargo xtask build-gui linux
      - name: Package native Linux installers
        run: cargo xtask package-desktop linux
      - name: Package complete standalone native daemon and separate feed
        run: cargo xtask package-daemon
      - name: Generate manifests from actual packaged artifacts
        run: cargo xtask release manifests
      - uses: actions/upload-artifact@v4
        with:
          name: native-packages-linux-x64
          path: |
            artifacts/native/Paseo-Sessions-*
            artifacts/native/Paseo-Daemon-*
            artifacts/native/daemon-*.json
            artifacts/native/flutter-*.json
            artifacts/native/packages-*.json
          if-no-files-found: error
          retention-days: 30
