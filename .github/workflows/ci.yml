name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.1
      # libghostty-vt-sys builds the Ghostty VT library with Zig 0.15.2; the
      # action also restores Zig's global cache (Ghostty's fetched packages).
      - uses: ./.github/actions/setup-zig
        with:
          cache-key: tests-linux-x64
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-linux-x64
      # Makepad links X11/GL/audio; native file dialogs also require Wayland.
      - name: Install native GUI build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libglx-dev libgl-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev
      - name: Run Rust workspace tests
        run: cargo test --locked --workspace --all-targets
