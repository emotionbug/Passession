name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-linux-x64
      - name: Run Rust workspace tests
        run: cargo test --locked --workspace --all-targets
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
          cache-key: flutter-sdk-Linux-X64-3.47.5
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-Linux-X64-3.47.5-${{ hashFiles('packages/flutter_app/pubspec.lock') }}
      - name: Install Flutter test native-asset prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev
      - name: Resolve locked Flutter packages
        working-directory: packages/flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Run Flutter unit and widget tests
        working-directory: packages/flutter_app
        run: flutter test --no-pub
