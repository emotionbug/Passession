name: Native Desktop Rollout

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing canonical release tag (vX.Y.Z or vX.Y.Z-beta.N)
        required: true
        type: string
      rollout_hours:
        description: Total ramp duration since original release date; 0 admits everyone
        required: true
        type: string

concurrency:
  group: desktop-rollout-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  stamp:
    if: github.repository == 'emotionbug/paseo'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SOURCE_TAG: ${{ inputs.tag }}
      NEW_HOURS: ${{ inputs.rollout_hours }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - name: Validate all six feeds and stamp without restarting original ramps
        run: cargo xtask release rollout
