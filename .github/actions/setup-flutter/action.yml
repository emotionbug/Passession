name: Set up native Flutter SDK
description: Use release archives where available and pinned source bootstrap for Linux and Windows ARM64.
inputs:
  flutter-version:
    description: Exact Flutter version
    required: true
  channel:
    description: Flutter release channel
    default: stable
  cache:
    description: Cache the SDK
    default: "true"
  cache-key:
    description: Optional SDK cache key
    default: ""
runs:
  using: composite
  steps:
    - name: Install archived Flutter SDK
      if: ${{ !(runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows')) }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache }}
        cache-key: ${{ inputs.cache-key }}
    - name: Validate pinned ARM64 SDK version
      if: ${{ runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows') }}
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.flutter-version }}
        SDK_CHANNEL: ${{ inputs.channel }}
      run: |
        if [[ "$SDK_VERSION" != "3.47.5" || "$SDK_CHANNEL" != "stable" ]]; then
          echo "Update the pinned ARM64 Flutter source revision when changing the SDK version." >&2
          exit 1
        fi
    - name: Check out pinned Flutter source
      if: ${{ runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows') }}
      uses: actions/checkout@v6
      with:
        repository: flutter/flutter
        ref: "3.47.5"
        path: .paseo-flutter-sdk
        fetch-depth: 1
        persist-credentials: false
    - name: Verify immutable Flutter source revision
      if: ${{ runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows') }}
      shell: bash
      run: |
        revision="$(git -C "$GITHUB_WORKSPACE/.paseo-flutter-sdk" rev-parse HEAD)"
        if [ "$revision" != "6a19cca56475dbfba1478ee68d7bd0c2ef891da1" ]; then
          echo "Flutter source tag no longer matches the pinned revision." >&2
          exit 1
        fi
    - name: Cache native SDK bootstrap
      if: ${{ inputs.cache == 'true' && runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows') }}
      uses: actions/cache@v4
      with:
        path: .paseo-flutter-sdk/bin/cache
        key: flutter-source-${{ runner.os }}-${{ runner.arch }}-6a19cca56475dbfba1478ee68d7bd0c2ef891da1
    - name: Bootstrap native Linux ARM64 SDK
      if: ${{ runner.arch == 'ARM64' && runner.os == 'Linux' }}
      shell: bash
      run: |
        sdk="$GITHUB_WORKSPACE/.paseo-flutter-sdk"
        "$sdk/bin/flutter" --version
        dart_version="$("$sdk/bin/dart" --version 2>&1)"
        case "$dart_version" in
          *'"linux_arm64"'*) ;;
          *) printf 'Expected native Linux ARM64 Dart, got: %s\n' "$dart_version" >&2; exit 1 ;;
        esac
        printf '%s/bin\n' "$sdk" >> "$GITHUB_PATH"
        printf 'FLUTTER_ROOT=%s\n' "$sdk" >> "$GITHUB_ENV"
    - name: Bootstrap native Windows ARM64 SDK
      if: ${{ runner.arch == 'ARM64' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $sdk = Join-Path $env:GITHUB_WORKSPACE '.paseo-flutter-sdk'
        & "$sdk/bin/flutter.bat" --version
        if ($LASTEXITCODE -ne 0) { throw 'Native Flutter SDK bootstrap failed' }
        $dartVersion = (& "$sdk/bin/dart.bat" --version 2>&1 | Out-String)
        if ($LASTEXITCODE -ne 0 -or $dartVersion -notmatch '"windows_arm64"') {
          throw "Expected native Windows ARM64 Dart, got: $dartVersion"
        }
        "$sdk/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "FLUTTER_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
