name: Set up native Flutter SDK
description: Install archived SDKs or verified reusable Linux and Windows ARM64 SDK release assets.
inputs:
  flutter-version:
    description: Exact Flutter version
    required: true
  channel:
    description: Flutter release channel
    default: stable
  cache:
    description: Cache the SDK
    default: "true"
  cache-key:
    description: Optional SDK cache key
    default: ""
runs:
  using: composite
  steps:
    - name: Install archived Flutter SDK
      if: ${{ !(runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows')) }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache }}
        cache-key: ${{ inputs.cache-key }}
    - name: Set up SDK installer toolchain
      if: ${{ runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows') }}
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ runner.os == 'Windows' && '1.93.1-aarch64-pc-windows-msvc' || '1.93.1-aarch64-unknown-linux-gnu' }}
    - name: Cache verified ARM64 SDK downloads
      if: ${{ inputs.cache == 'true' && runner.arch == 'ARM64' && (runner.os == 'Linux' || runner.os == 'Windows') }}
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/paseo-flutter-sdk/downloads
        key: ${{ inputs.cache-key || 'flutter-sdk' }}-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/flutter-sdk.json') }}
    - name: Install published Linux ARM64 SDK
      if: ${{ runner.arch == 'ARM64' && runner.os == 'Linux' }}
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: 1.93.1-aarch64-unknown-linux-gnu
        FLUTTER_SDK_VERSION: ${{ inputs.flutter-version }}
        FLUTTER_SDK_CHANNEL: ${{ inputs.channel }}
        GH_TOKEN: ${{ github.token }}
      run: cargo xtask flutter-sdk install --version "$FLUTTER_SDK_VERSION" --channel "$FLUTTER_SDK_CHANNEL"
    - name: Install published Windows ARM64 SDK
      if: ${{ runner.arch == 'ARM64' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        RUSTUP_TOOLCHAIN: 1.93.1-aarch64-pc-windows-msvc
        FLUTTER_SDK_VERSION: ${{ inputs.flutter-version }}
        FLUTTER_SDK_CHANNEL: ${{ inputs.channel }}
        GH_TOKEN: ${{ github.token }}
      run: |
        cargo xtask flutter-sdk install --version "$env:FLUTTER_SDK_VERSION" --channel "$env:FLUTTER_SDK_CHANNEL"
        if ($LASTEXITCODE -ne 0) { throw 'Published native Flutter SDK installation failed' }
