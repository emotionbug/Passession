# Pull-request checks are routed by the behavior they prove. Package consumers
# do not inherit their dependencies' test suites; main and normal manual CI runs
# execute every contract. CI Recovery explicitly selects one existing check.
routing:
  - ".github/ci-paths.yml"

workspace:
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - ".cargo/**"
  - "xtask/**"

ci:
  - ".github/actions/**"
  - ".github/workflows/ci.yml"
  - ".github/workflows/ci-recovery.yml"

format:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "rustfmt.toml"

quality:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "Cargo.lock"
  - ".cargo/**"
  - "xtask/**"

daemon:
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - "packages/daemon/**"
  - "packages/protocol/src/provider-definitions.json"
  - "skills/**"
  - "packages/plugin/**"
  - "plugins/**"

sdk:
  - "packages/plugin/**"
  - "plugin-examples/**"
  - "public-docs/plugins/**"
  - "packages/client/**"
  - "packages/highlight/**"
  - "packages/protocol/**"

relay:
  - "packages/relay/**"
  - "packages/relay-cloudflare/**"
  - "xtask/src/relay_cloudflare.rs"

# Shared Dart, assets and package resolutions affect every native build.
# Platform implementation changes compile on their owning host only.
flutter:
  - "packages/flutter_app/!(linux|windows|macos|android|ios)/**"
  - "packages/flutter_app/*"
  - "packages/flutter_audio/lib/**"
  - "packages/flutter_audio/pubspec.yaml"
  - "packages/flutter_desktop_host/integrations/pubspec.yaml"
  - "packages/flutter_desktop_host/integrations/lib/**"
  - "packages/flutter_desktop_host/updater/**"
  - "packages/flutter_desktop_host/third_party/desktop_multi_window/lib/**"
  - "packages/flutter_desktop_host/third_party/desktop_multi_window/pubspec.yaml"

flutter_linux:
  - "packages/flutter_app/linux/**"
  - "packages/flutter_desktop_host/integrations/linux/**"
  - "packages/flutter_desktop_host/third_party/desktop_multi_window/linux/**"

flutter_windows:
  - "packages/flutter_app/windows/**"
  - "packages/flutter_desktop_host/integrations/windows/**"
  - "packages/flutter_desktop_host/third_party/desktop_multi_window/windows/**"

flutter_macos:
  - "packages/flutter_app/macos/**"
  - "packages/flutter_desktop_host/integrations/macos/**"
  - "packages/flutter_desktop_host/third_party/desktop_multi_window/macos/**"

flutter_android:
  - "packages/flutter_app/android/**"
  - "packages/flutter_audio/android/**"

flutter_ios:
  - "packages/flutter_app/ios/**"
  - "packages/flutter_audio/ios/**"
